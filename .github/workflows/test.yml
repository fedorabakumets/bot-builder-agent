# @fileoverview Тесты и сборка агента для Linux на закреплённой версии Go.
name: Tests and Linux build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Запрещаем неявное переключение на другую версию компилятора.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Тесты
        run: go test ./...
      - name: Сборка Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -o dist/bot-builder-agent ./cmd/bot-builder-agent
